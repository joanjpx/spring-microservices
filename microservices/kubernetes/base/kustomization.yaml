apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spring-microservices
resources:
  - namespace.yaml
  - databases.yaml
  - discovery.yaml
  - inventory.yaml
  - order.yaml
  - product.yaml
  - gateway.yaml
configMapGenerator:
  - name: hpa-load-script
    files:
      - load.js=load.js
    options:
      disableNameSuffixHash: true
